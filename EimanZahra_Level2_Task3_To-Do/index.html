<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Smart To-Do App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="app-wrapper">
            <!-- Header -->
            <div class="app-header">
                <div class="header-icon">
                    <i class="fas fa-check-double"></i>
                </div>
                <h1>TaskFlow</h1>
                <p>Organize your day, one task at a time</p>
            </div>

            <!-- Add Task Section -->
            <div class="add-task-section">
                <div class="input-group">
                    <input type="text" id="taskInput" placeholder="What do you need to do?..." maxlength="200">
                    <button id="addTaskBtn" class="btn-add">
                        <i class="fas fa-plus"></i> Add Task
                    </button>
                </div>
            </div>

            <!-- Stats Summary -->
            <div class="stats-summary">
                <div class="stat-card pending-stat">
                    <i class="fas fa-clock"></i>
                    <div>
                        <span class="stat-number" id="pendingCount">0</span>
                        <span class="stat-label">Pending</span>
                    </div>
                </div>
                <div class="stat-card completed-stat">
                    <i class="fas fa-check-circle"></i>
                    <div>
                        <span class="stat-number" id="completedCount">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                </div>
                <div class="stat-card total-stat">
                    <i class="fas fa-tasks"></i>
                    <div>
                        <span class="stat-number" id="totalCount">0</span>
                        <span class="stat-label">Total Tasks</span>
                    </div>
                </div>
            </div>

            <!-- Task Sections -->
            <div class="tasks-container">
                <!-- Pending Tasks -->
                <div class="task-section">
                    <div class="section-header pending-header">
                        <div class="section-title">
                            <i class="fas fa-hourglass-half"></i>
                            <h2>Pending Tasks</h2>
                        </div>
                        <span class="task-badge" id="pendingBadge">0</span>
                    </div>
                    <div class="task-list" id="pendingTasksList">
                        <div class="empty-state">
                            <i class="fas fa-smile-wink"></i>
                            <p>No pending tasks! You're all caught up 🎉</p>
                        </div>
                    </div>
                </div>

                <!-- Completed Tasks -->
                <div class="task-section">
                    <div class="section-header completed-header">
                        <div class="section-title">
                            <i class="fas fa-check-circle"></i>
                            <h2>Completed Tasks</h2>
                        </div>
                        <span class="task-badge" id="completedBadge">0</span>
                    </div>
                    <div class="task-list" id="completedTasksList">
                        <div class="empty-state">
                            <i class="fas fa-tasks"></i>
                            <p>No completed tasks yet. Get started!</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="clearCompletedBtn" class="btn-clear">
                    <i class="fas fa-trash-alt"></i> Clear Completed
                </button>
                <button id="deleteAllBtn" class="btn-delete-all">
                    <i class="fas fa-skull-crosswalk"></i> Delete All Tasks
                </button>
            </div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> Edit Task</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <input type="text" id="editTaskInput" placeholder="Update your task...">
                <div class="modal-buttons">
                    <button id="saveEditBtn" class="btn-save">Save Changes</button>
                    <button id="cancelEditBtn" class="btn-cancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
